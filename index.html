<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>À la lettre</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div id="load-overlay" role="status" aria-live="polite" aria-busy="true" aria-label="Chargement">
    <div class="load-card">
      <p class="load-text" id="load-text">Ça carto-charge…</p>
      <div class="load-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="load-bar-fill" class="load-bar-fill"></div>
      </div>
    </div>
  </div>

  <div id="intro-modal" class="intro-modal" hidden role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <div class="intro-card">
      <h1 id="intro-title">À la lettre</h1>
      <p class="lead" id="intro-lead">Le petit bac, mais avec que les pays.</p>

      <p class="field-label">Territoire</p>
      <div class="choice-grid" role="group" aria-label="Territoire">
        <button type="button" data-territory="world" aria-pressed="true">Monde</button>
        <button type="button" data-territory="us" aria-pressed="false">États-Unis</button>
        <button type="button" data-territory="france" aria-pressed="false">France</button>
      </div>

      <p class="field-label">Lieux</p>
      <div class="mode-switch mode-switch-places" role="group" aria-label="Nombre de lieux">
        <button type="button" data-places="1" aria-pressed="false" aria-label="1 lieu">1</button>
        <button type="button" data-places="2" aria-pressed="false" aria-label="2 lieux">2</button>
        <button type="button" data-places="3" aria-pressed="true" aria-label="3 lieux">3</button>
      </div>

      <p class="field-label">Rythme</p>
      <div class="mode-switch mode-switch-3" role="group" aria-label="Niveau de stress">
        <button type="button" data-ms="15000" aria-pressed="true">À la cool</button>
        <button type="button" data-ms="10000" aria-pressed="false">Stressant</button>
        <button type="button" data-ms="5000" aria-pressed="false">Hyper stressant</button>
      </div>
      <p class="mode-note" id="pace-note"></p>

      <p class="field-label">Partie</p>
      <div class="mode-switch" role="group" aria-label="Nombre de manches">
        <button type="button" data-length="5" aria-pressed="true">5 manches</button>
        <button type="button" data-length="10" aria-pressed="false">10 manches</button>
      </div>

      <button type="button" id="btn-start" class="btn-primary">Je me lance</button>
    </div>
  </div>

  <div id="timer-block" class="timer-block" hidden aria-label="Temps restant">
    <div class="timer-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
      <div id="timer-fill" class="timer-fill">
        <span class="timer-value" id="timer-value">15 s</span>
      </div>
    </div>
  </div>

  <header id="chrome" hidden>
    <p class="round-meta" id="round-kicker">Manche 1 / 5</p>
    <p class="round-prompt" id="score-line">Score 0</p>
  </header>

  <aside id="history-wrap" class="score-history-wrap" hidden aria-label="Votre partie">
    <p class="score-history-heading">Votre partie</p>
    <ul id="history" class="score-history"></ul>
  </aside>

  <main id="stage" hidden>
    <p class="ask-line" id="ask-line">Trouvez trois pays qui commencent par…</p>
    <p class="letter" id="letter" aria-live="polite">A</p>
    <div id="slots" class="slots" data-count="3"></div>
  </main>

  <div id="dock" hidden>
    <div class="dock-card">
      <form id="guess-form">
        <div class="guess-row">
          <label class="sr-only" for="guess">Votre réponse</label>
          <input id="guess" name="place-guess" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Un pays…">
          <button type="submit" id="btn-validate" class="btn-primary">Valider</button>
        </div>
        <p class="guess-hint" id="guess-hint" aria-live="polite"></p>
      </form>
      <div id="feedback" hidden>
        <p class="feedback-kicker" id="feedback-kicker">Bravo !</p>
        <p class="result-detail" id="feedback-detail"></p>
        <button type="button" id="btn-next" class="btn-primary btn-block">Manche suivante</button>
      </div>
    </div>
  </div>

  <div id="finish-modal" class="intro-modal" hidden role="dialog" aria-modal="true" aria-labelledby="finish-title">
    <div class="intro-card finish-card">
      <h1 id="finish-title">Partie terminée</h1>
      <p class="final-score-kicker">Votre note</p>
      <p class="final-score" id="final-score">—</p>
      <p class="finish-pace" id="finish-pace"></p>
      <ul class="finish-recap" id="finish-recap" aria-label="Bilan des manches"></ul>
      <button type="button" id="btn-replay" class="btn-primary">Rejouer</button>
    </div>
  </div>

  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <script src="app.js?v=10"></script>
</body>
</html>
